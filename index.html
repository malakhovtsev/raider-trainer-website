<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raider Trainer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        integrity="sha384-h/hnnw1Bi4nbpD6kE7nYfCXzovi622sY5WBxww8ARKwpdLj5kUWjRuyiXaD1U2JT" crossorigin="anonymous"
        referrerpolicy="no-referrer">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="site-header">
        <div class="container">
            <h1>Raider Trainer</h1>
            <p>Website placeholder. Updates coming soon!</p>
        </div>
    </header>

    <main class="container">
        <section class="team-section" aria-labelledby="students-title">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">The team</p>
                    <h2 id="students-title">Students</h2>
                </div>
            </div>

            <div class="student-list">
                <article class="student">
                    <h3>Andrii Malakhovtsev</h3>
                    <a class="social-link" href="https://github.com/malakhovtsev" target="_blank"
                        rel="noopener noreferrer" aria-label="Andrii Malakhovtsev on GitHub">
                        <i class="fa-brands fa-github" aria-hidden="true"></i>
                    </a>
                </article>

                <article class="student">
                    <h3>Fern Badenhop</h3>
                    <a class="social-link" href="https://github.com/Zxidenbel" target="_blank" rel="noopener noreferrer"
                        aria-label="Fern Badenhop on GitHub">
                        <i class="fa-brands fa-github" aria-hidden="true"></i>
                    </a>
                </article>

                <article class="student">
                    <h3>Nathan R. Tuttle</h3>
                    <a class="social-link" href="https://github.com/ntuttle22" target="_blank" rel="noopener noreferrer"
                        aria-label="Nathan R. Tuttle on GitHub">
                        <i class="fa-brands fa-github" aria-hidden="true"></i>
                    </a>
                </article>
            </div>
        </section>

        <section aria-labelledby="reports-title">
            <div class="section-heading">
                <div>
                    <h2 id="reports-title">Weekly reports</h2>
                </div>
            </div>

            <div class="timeline" id="reports"></div>
            <noscript>
                <p>Weekly reports require JavaScript to display.</p>
            </noscript>
        </section>


    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Raider Trainer</p>
        </div>
    </footer>
    <script src="reports.js"></script>
</body>

</html>
